# Drone Tank Task Configuration
# Environment setup for drone learning to identify and strike a tank

# Task name
task: DroneTankTask

# Environment settings
sim:
  dt: 0.02  # Simulation timestep
  use_gpu_pipeline: true
  physics_engine: "physx"
  
# Scene settings
scene:
  default_ground_plane: true
  default_ground_plane_friction: 1.0
  default_ground_plane_restitution: 0.0

# Drone settings
drone:
  usd_path: "assets/drone.usd"  # Path to drone USD asset
  spawn:
    translation: [0.0, 5.0, 0.0]  # Initial position
    orientation: [0.0, 0.0, 0.0, 1.0]  # Initial orientation (quaternion)
  physics:
    mass: 1.0
    inertia: [0.1, 0.1, 0.1]
  sensors:
    camera:
      enabled: true
      resolution: [640, 480]
      fov: 60.0
      position: [0.0, 0.0, 0.0]  # Relative to drone
      orientation: [0.0, 0.0, 0.0, 1.0]

# Tank settings
tank:
  usd_path: "assets/tank.usd"  # Path to tank USD asset
  spawn:
    translation: [10.0, 0.0, 0.0]  # Initial position
    orientation: [0.0, 0.0, 0.0, 1.0]
  physics:
    mass: 100.0
    static: false

# Observation settings
observations:
  camera:
    enabled: true
    normalize: true
  state:
    enabled: true
    include:
      - position
      - velocity
      - orientation
      - angular_velocity

# Action settings
actions:
  space: "continuous"
  num_actions: 4  # Thrust in x, y, z directions + yaw
  scale: [1.0, 1.0, 1.0, 0.5]  # Action scaling

# Episode settings
episode:
  max_length: 1000  # Maximum steps per episode
  reset_on_crash: true
  reset_on_success: true

