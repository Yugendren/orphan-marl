# PPO Algorithm Configuration for OmniDrones

name: PPO

# Training frequency
train_every: 32  # Collect this many steps before training

# PPO hyperparameters
ppo_epochs: 4
num_minibatches: 16
clip_param: 0.2
entropy_coef: 0.01
critic_coef: 0.5

# Discount factors
gamma: 0.99
gae_lambda: 0.95

# Max gradient norm for clipping
max_grad_norm: 0.5

# Actor network
actor:
  lr: 3.e-4
  weight_decay: 0.0
  hidden_units: [256, 256]
  activation: tanh
  layer_norm: false

# Critic network
critic:
  lr: 3.e-4
  weight_decay: 0.0
  hidden_units: [256, 256]
  activation: tanh
  layer_norm: false
