# DroneToTarget Task Configuration
# Navigate drone to a tank target - drone spawns on circle around tank, always facing it

name: DroneToTarget

# Simulation physics
sim:
  dt: 0.01
  substeps: 2
  device: cuda:0

# Environment settings
env:
  num_envs: 1024
  max_episode_length: 500
  use_vision: false  # Set true for camera-based observations

# Drone configuration
drone:
  model: Iris  # Uses OmniDrones built-in Iris quadrotor
  spawn_height: 3.0  # Height above ground

# Target (Tank) configuration
target:
  # Path to tank USD file (relative to project or absolute)
  usd_path: "scenes/training_scene_simple.usd"
  # Tank prim path within the USD file
  prim_path: "/World/SM_Tank_T72b"
  # Tank position (center of spawn circle)
  position: [0.0, 0.0, 0.0]
  
# Circular spawn configuration
spawn:
  # Drone spawns on circle around tank
  radius_min: 8.0      # Minimum spawn radius (meters)
  radius_max: 15.0     # Maximum spawn radius (meters)
  height_min: 2.0      # Minimum spawn height
  height_max: 5.0      # Maximum spawn height
  # Drone always faces tank (camera pointing at target)
  face_target: true

# Observation space settings
obs:
  include_velocity: true
  include_angular_velocity: true
  include_relative_target: true

# Action space: velocity commands [vx, vy, vz, yaw_rate]
action:
  max_velocity: [2.0, 2.0, 1.0]
  max_yaw_rate: 1.0

# Reward shaping
reward:
  distance_scale: -1.0      # Penalty per meter from target
  success_bonus: 100.0      # Bonus for reaching target
  crash_penalty: -50.0      # Penalty for crashing
  progress_scale: 20.0      # Reward for getting closer
  alive_bonus: 0.1          # Small bonus per step alive
  facing_bonus: 0.5         # Bonus for keeping tank in view
